<div
  class="relative aspect-[3/4] rounded-[20px] overflow-hidden bg-white/10 cursor-pointer
         transition-transform duration-300 hover:scale-[1.04] hover:shadow-xl"
  (click)="onClick()"
>

  <img
    [src]="film.poster_path 
      ? 'https://image.tmdb.org/t/p/w500' + film.poster_path 
      : 'assets/placeholder.png'"
    [alt]="film.title"
    class="absolute inset-0 w-full h-full object-cover"
    loading="lazy"
  />

  <!-- overlay cinema -->
  <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/40 to-black"></div>

  <!-- titolo -->
  <div class="absolute bottom-0 p-4">
    <p class="text-white font-semibold leading-tight text-sm">
      {{ film.title }}
    </p>
    <p class="text-white/60 text-xs">
      {{ film.release_date }}
    </p>
  </div>

  <!-- chip -->
  <div class="absolute top-3 left-3 px-2 py-1 rounded-full
              bg-black/60 backdrop-blur-sm
              border border-white/10 text-white/70 text-xs">
    Film
  </div>

</div>

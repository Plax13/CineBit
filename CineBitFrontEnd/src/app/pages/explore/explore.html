<ui-page>
  <div header class="relative px-6 md:px-10 pb-2 min-h-[290px] overflow-hidden">
    <div class="absolute inset-0 z-0 pointer-events-none">
      <ui-hero-banner></ui-hero-banner>
    </div>

    <div class="relative z-10 flex flex-col gap-8 pt-6">
      <div class="flex items-center justify-between">
        <p class="text-[#D9D9D9] text-sm">Cosa vuoi guardare oggi?</p>
<button 
  class="h-12 w-12 rounded-full border border-white/15 bg-white/5 hover:bg-white/10 transition flex items-center justify-center overflow-hidden group"
  (click)="goToProfile()" 
  aria-label="Vai al profilo">
  
  @if (user) { <div class="h-full w-full bg-gradient-to-tr from-[#55BBEF] to-[#2B5E77] flex items-center justify-center text-sm font-bold text-white select-none group-hover:scale-110 transition-transform">
      {{ user.nome?.charAt(0) }}{{ user.cognome?.charAt(0) }}
    </div>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 19.125a7.5 7.5 0 0115 0" />
    </svg>
  }
</button>
      </div>
      <searchbar [(query)]="query" (searchEvent)="onSearch()"></searchbar>
    </div>
  </div>

  <div main class="flex flex-col gap-8">
    
    @if (isAiThinking) {
      <app-ai-loader [text]="loadingText"></app-ai-loader>
    }

    @if (error) {
      <p class="text-red-400 text-center bg-red-400/10 py-3 rounded-lg">{{ error }}</p>
    }

    @if (!isAiThinking) {
      <section class="flex items-center justify-between">
        <h2 class="text-lg md:text-xl font-semibold">
          {{ query.trim() ? 'Consigliati per te' : 'Titoli del momento' }}
        </h2>

        <div class="hidden md:flex gap-2">
          <button class="h-10 w-10 rounded-full border border-white/15 bg-white/5 hover:bg-white/10 flex items-center justify-center"
            (click)="scrollRow(-1)" aria-label="Scroll left">‹</button>
          <button class="h-10 w-10 rounded-full border border-white/15 bg-white/5 hover:bg-white/10 flex items-center justify-center"
            (click)="scrollRow(1)" aria-label="Scroll right">›</button>
        </div>
      </section>

      <section #row class="flex gap-4 overflow-x-auto pb-6 snap-x snap-mandatory scroll-smooth [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        @for (film of movies; track film.id) {
          <div class="snap-start shrink-0 w-[160px] sm:w-[190px] md:w-[220px] transition-transform hover:scale-105 duration-300">
            <card-film [film]="film" (cliccata)="onCardClick($event)"></card-film>
          </div>
        } @empty {
           @if (!loading) { <p class="text-white/40 text-center w-full">Nessun film trovato.</p> }
        }
      </section>
    }
  </div>

  <div footer></div>
</ui-page>

<div class="loader-container">
  <svg class="projector-loader" viewBox="0 0 260 140" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 40 L190 20" stroke="#55BBEF" stroke-width="2" fill="none" class="film-strand" opacity="0.6"/>
    <path d="M50 100 L190 120" stroke="#55BBEF" stroke-width="2" fill="none" class="film-strand" opacity="0.6"/>

    <g transform="translate(50, 70)">
      <g class="spin-fast">
        <circle cx="0" cy="0" r="30" fill="none" stroke="#55BBEF" stroke-width="3" />
        <rect x="-2" y="-25" width="4" height="10" rx="1" fill="#55BBEF" />
        <rect x="-2" y="15" width="4" height="10" rx="1" fill="#55BBEF" />
        <rect x="15" y="-2" width="10" height="4" rx="1" fill="#55BBEF" />
        <rect x="-25" y="-2" width="10" height="4" rx="1" fill="#55BBEF" />
        <circle cx="0" cy="0" r="4" fill="#55BBEF" />
      </g>
    </g>

    <g transform="translate(190, 70)">
      <g class="spin-slow">
        <circle cx="0" cy="0" r="50" fill="none" stroke="#55BBEF" stroke-width="3" />
        <circle cx="0" cy="-30" r="8" fill="none" stroke="#55BBEF" stroke-width="2" />
        <circle cx="0" cy="30" r="8" fill="none" stroke="#55BBEF" stroke-width="2" />
        <circle cx="-30" cy="0" r="8" fill="none" stroke="#55BBEF" stroke-width="2" />
        <circle cx="30" cy="0" r="8" fill="none" stroke="#55BBEF" stroke-width="2" />
        <circle cx="0" cy="0" r="6" fill="#55BBEF" />
      </g>
    </g>
  </svg>
  
  <p class="loader-text">{{ text }}</p>
</div>
